<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QKYB - Quantum Wallet</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#5b21b6">
<link rel="icon" href="./icon-512.png">
<style>
*{font-family:Inter,sans-serif;box-sizing:border-box}
body{margin:0;background:#f5f3ff}
.header{background:#5b21b6;color:#fff;padding:16px;border-radius:0 0 24px 24px}
.balance-card{background:#fff;margin:-20px 16px 16px;padding:16px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px;padding:16px}
.item{background:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer}
.item span{font-size:24px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999}
.modal-box{background:#fff;width:90%;max-width:360px;padding:20px;border-radius:20px}
.modal-box input, .modal-box select{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:10px}
.btn-purple{width:100%;padding:12px;background:#5b21b6;color:#fff;border:none;border-radius:10px;margin-top:8px;font-weight:bold}
.btn-grey{width:100%;padding:12px;background:#eee;border:none;border-radius:10px;margin-top:8px}
.hidden{display:none}
.infoBox{padding:10px;border-radius:10px;margin:6px 0;font-weight:bold;display:none}
</style>
</head>
<body>

<div class="header">
  <h2>🛡️ QKYB <small style="float:right;background:#22c55e;padding:4px 8px;border-radius:20px;font-size:12px">UP-BR-B03B</small></h2>
  <input placeholder="🔍 Search transactions..." style="width:100%;padding:10px;border-radius:20px;border:none;margin-top:10px">
</div>

<div class="balance-card">
  <h2 style="margin:0">0.00 POL + 1000 QKYB</h2>
  <small style="color:green">Rahul • UP-BR-B03B • REAL</small><br>
  <small style="word-break:break-all">0xb03bFD1f074771eed7c0f480CE16075539152822</small>
  <div style="margin-top:10px;background:#f3f0ff;padding:8px;border-radius:8px">
    <b>QKYB ID:</b> qkyb_up-br-b03b@qkyb<br>
    <b>UP Code:</b> UP-BR-B03B <span style="background:#dcfce7;padding:2px 6px;border-radius:6px">Real BTC Style ✓</span>
  </div>
</div>

<div class="grid">
  <div class="item" onclick="openModal('mobileModal')"><span>📲</span><br>Mobile</div>
  <div class="item" onclick="openModal('dthModal')"><span>📺</span><br>DTH</div>
  <div class="item" onclick="openModal('electricModal')"><span>💡</span><br>Electric</div>
  <div class="item" onclick="openModal('ccModal')"><span>💳</span><br>CC Bill</div>
  <div class="item" onclick="openModal('bankModal')"><span>🏦</span><br>Bank</div>
</div>

<!-- MOBILE MODAL - FINAL WITH OPERATOR -->
<div id="mobileModal" class="modal hidden">
  <div class="modal-box">
    <h3>📲 Mobile Recharge</h3>
    <input id="mobNumber" type="tel" maxlength="10" placeholder="Mobile Number" oninput="detectOperator(this.value)">
    <div id="operatorBox" class="infoBox" style="background:#f3f0ff"></div>
    <select id="planSelect" style="display:none" onchange="setPlanAmount()"></select>
    <input id="mobAmount" type="number" placeholder="Amount QKYB">
    <input id="mobPin" type="password" placeholder="PIN" maxlength="4">
    <button onclick="payNow('Mobile')" class="btn-purple">Pay Mobile</button>
    <button onclick="closeModal('mobileModal')" class="btn-grey">Cancel</button>
  </div>
</div>

<!-- ELECTRICITY MODAL - FINAL -->
<div id="electricModal" class="modal hidden">
  <div class="modal-box">
    <h3>💡 Electricity</h3>
    <input id="electricId" placeholder="Electricity ID / Number" oninput="detectElectric(this.value)">
    <div id="electricBoardBox" class="infoBox" style="background:#fff3cd"></div>
    <input id="electricAmount" placeholder="Amount QKYB">
    <input id="electricPin" type="password" placeholder="PIN">
    <button onclick="payNow('Electricity')" class="btn-purple">Pay Electricity</button>
    <button onclick="closeModal('electricModal')" class="btn-grey">Cancel</button>
  </div>
</div>

<!-- CREDIT CARD MODAL - FINAL -->
<div id="ccModal" class="modal hidden">
  <div class="modal-box">
    <h3>💳 Credit Card</h3>
    <input id="ccNumber" placeholder="Credit Card ID / Number" oninput="detectCC(this.value)">
    <div id="ccTypeBox" class="infoBox" style="background:#e3f2fd"></div>
    <input id="ccAmount" placeholder="Amount QKYB">
    <input id="ccPin" type="password" placeholder="PIN">
    <button onclick="payNow('Credit Card')" class="btn-purple">Pay Credit Card</button>
    <button onclick="closeModal('ccModal')" class="btn-grey">Cancel</button>
  </div>
</div>

<!-- BANK MODAL - FINAL -->
<div id="bankModal" class="modal hidden">
  <div class="modal-box">
    <h3>🏦 To Bank</h3>
    <input id="bankAcc" placeholder="Account Number">
    <input id="bankIfsc" placeholder="IFSC (SBIN0123456)" maxlength="11" oninput="detectBank(this.value)" style="text-transform:uppercase">
    <div id="bankNameBox" class="infoBox" style="background:#e8f5e9"></div>
    <input id="bankAmount" placeholder="Amount QKYB">
    <input id="bankPin" type="password" placeholder="PIN">
    <button onclick="payNow('Bank')" class="btn-purple">Send to Bank</button>
    <button onclick="closeModal('bankModal')" class="btn-grey">Cancel</button>
  </div>
</div>

<!-- DTH MODAL -->
<div id="dthModal" class="modal hidden">
  <div class="modal-box">
    <h3>📺 DTH Recharge</h3>
    <input id="dthId" placeholder="DTH ID" oninput="detectDTH(this.value)">
    <div id="dthBox" class="infoBox" style="background:#fce7f3"></div>
    <input id="dthAmount" placeholder="Amount QKYB">
    <input id="dthPin" type="password" placeholder="PIN">
    <button onclick="payNow('DTH')" class="btn-purple">Pay DTH</button>
    <button onclick="closeModal('dthModal')" class="btn-grey">Cancel</button>
  </div>
</div>

<script>
// COMMON
function openModal(id){document.getElementById(id).classList.remove('hidden')}
function closeModal(id){document.getElementById(id).classList.add('hidden')}
function payNow(type){alert('✅ '+type+' Payment Success!\n1000 QKYB se deduct hoga - Rahul (UP-BR-B03B)'); closeModal(type.toLowerCase()+'Modal'); if(type=='Mobile') closeModal('mobileModal'); if(type=='Bank') closeModal('bankModal'); if(type=='Electricity') closeModal('electricModal'); if(type=='Credit Card') closeModal('ccModal'); if(type=='DTH') closeModal('dthModal');}

// MOBILE LOGIC
const PLANS = {Jio:[19,149,199,299,666,719], Airtel:[19,149,199,299,479,699], Vi:[19,149,299,459], BSNL:[19,97,199,397]};
function detectOperator(num){
 let box=document.getElementById('operatorBox'), sel=document.getElementById('planSelect');
 if(num.length<4){box.style.display='none'; sel.style.display='none'; return;}
 let op=num[0]>=6 && num[0]<=7 ? (num.substring(0,2)>=80?'Airtel':'Jio') : 'Vi';
 if(num.startsWith('9')) op='Vi'; if(num.startsWith('8')||num.startsWith('7')) op='Jio'; if(num.startsWith('6')) op='Airtel';
 box.style.display='block'; box.innerHTML='📡 Operator: <b>'+op+'</b> • Circle: UP West';
 sel.innerHTML='<option>-- '+op+' Plans --</option>'; PLANS[op].forEach(a=>sel.innerHTML+=`<option value="${a}">₹${a} - ${a} QKYB</option>`); sel.style.display='block';
}
function setPlanAmount(){document.getElementById('mobAmount').value=document.getElementById('planSelect').value;}

// ELECTRICITY LOGIC - AGRA SPECIAL
function detectElectric(id){
 let box=document.getElementById('electricBoardBox');
 if(id.length<2){box.style.display='none';return;}
 box.style.display='block'; box.innerHTML='⚡ DVVNL - Agra (UP-BR-B03B) <br><small>Consumer: '+id+'</small>';
}

// CC LOGIC
function detectCC(num){
 let box=document.getElementById('ccTypeBox');
 if(num.length<1){box.style.display='none';return;}
 let t=num[0]=='4'?'Visa':num[0]=='5'?'MasterCard':num[0]=='6'?'RuPay':'Credit Card';
 box.style.display='block'; box.innerHTML='💳 '+t+' - '+num.substring(0,4)+' XXXX';
}

// BANK LOGIC
function detectBank(ifsc){
 let box=document.getElementById('bankNameBox');
 if(ifsc.length<4){box.style.display='none';return;}
 let m={SBIN:'State Bank of India',HDFC:'HDFC Bank',ICIC:'ICICI Bank',PUNB:'PNB',BARB:'Bank of Baroda',CNRB:'Canara Bank'};
 let bank=m[ifsc.substring(0,4).toUpperCase()]||'Bank Detected';
 box.style.display='block'; box.innerHTML='🏦 '+bank+' - '+ifsc.toUpperCase();
}

// DTH LOGIC
function detectDTH(id){
 let box=document.getElementById('dthBox');
 if(id.length<2){box.style.display='none';return;}
 box.style.display='block'; box.innerHTML='📺 Tata Play / Airtel DTH - ID: '+id;
}
</script>
</body>
</html>
