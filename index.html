<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QKYB - Quantum UP Wallet</title>
<link rel="icon" href="logo.png">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.12.1/dist/ethers.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
.phone{max-width:420px;margin:0 auto;background:#f8fafc;min-height:100vh;padding-bottom:70px}
.header{background:#5b21b6;color:#fff;padding:12px;border-radius:0 0 18px 18px;position:sticky;top:0;z-index:10}
.card{background:#fff;margin:12px;border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.btn{width:100%;padding:12px;border-radius:12px;border:none;font-weight:bold;cursor:pointer;margin-top:8px}
input,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:10px;margin-top:8px}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:#fff;border-top:1px solid #e5e7eb;display:flex;justify-content:space-around;padding:8px 0;z-index:20}
.bottom div{text-align:center;font-size:10px;cursor:pointer;padding:4px 12px;border-radius:10px}
.bottom .active{background:#f5f3ff;color:#5b21b6;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;padding:0 12px}
.grid-item{text-align:center;font-size:10px;cursor:pointer;padding:8px;border-radius:12px;background:#fff;border:1px solid #eee}
.grid-item div{width:40px;height:40px;background:#f1f5f9;border-radius:12px;margin:0 auto 5px;display:flex;align-items:center;justify-content:center;font-size:20px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99;align-items:center;justify-content:center}
.modal-box{background:#fff;width:92%;max-width:380px;border-radius:18px;padding:18px;max-height:85vh;overflow:auto}
.auth{background:#5b21b6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:22px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs div{flex:1;text-align:center;padding:10px;border-radius:10px;cursor:pointer;font-weight:bold;font-size:13px;border:1px solid #e5e7eb}
.tabs .active{background:#5b21b6;color:#fff}
.seed{background:#fef3c7;border:1px dashed #f59e0b;padding:12px;border-radius:10px;font-size:12px;word-spacing:6px;line-height:22px;margin-top:8px}
.verified{font-size:9px;background:#dcfce7;color:#166534;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<div id="authPage" class="auth"><div class="auth-box"><div style="text-align:center"><img src="logo.png" style="width:56px;height:56px;border-radius:14px"><h3>QKYB</h3><p style="font-size:11px">Quantum UP Wallet • Real Blockchain</p></div><div class="tabs"><div id="tabLogin" class="active" onclick="switchAuth('login')">Import Seed</div><div id="tabSignup" onclick="switchAuth('signup')">Create New</div></div><div id="loginForm"><textarea id="importSeed" rows="3" placeholder="12 word seed - BTC style"></textarea><input id="loginPin" type="password" placeholder="PIN 1234"><button class="btn" style="background:#5b21b6;color:white" onclick="importWallet()">Import & Login</button></div><div id="signupForm" style="display:none"><input id="sName" placeholder="Full Name - Sandeep"><input id="sPhone" placeholder="Mobile"><button class="btn" style="background:#16a34a;color:white" onclick="createRealWallet()">Create Real Wallet - BTC Style</button><div id="seedDisplay" style="display:none"><p style="font-size:12px;font-weight:bold;margin-top:12px;color:#b45309">🔐 12 Word Seed - Likh ke Rakh!</p><div id="seedWords" class="seed"></div><input id="sPin" type="password" placeholder="Set PIN 1234"><button class="btn" style="background:#5b21b6;color:white" onclick="confirmSeed()">I Saved - Enter Wallet</button></div></div><p id="authMsg" style="font-size:11px;text-align:center;margin-top:10px"></p></div></div>
<div id="mainApp" class="phone" style="display:none"></div>
<div id="bottomNav" class="bottom" style="display:none"></div>
<div id="modal" class="modal" onclick="closeM()"><div class="modal-box" onclick="event.stopPropagation()" id="modalContent"></div></div>
<script>
let currentUser=null,pin="1234",provider,tempWallet=null,balance=0,demoBal=1000,historyData=[];
provider=new ethers.JsonRpcProvider("https://rpc-amoy.polygon.technology");
function switchAuth(t){document.getElementById('loginForm').style.display=t==='login'?'block':'none';document.getElementById('signupForm').style.display=t==='signup'?'block':'none';document.getElementById('tabLogin').className=t==='login'?'active':'';document.getElementById('tabSignup').className=t==='signup'?'active':'';}
function createRealWallet(){let n=document.getElementById('sName').value;if(!n){document.getElementById('authMsg').innerText='Name required';document.getElementById('authMsg').style.color='red';return;}tempWallet=ethers.Wallet.createRandom();document.getElementById('seedWords').innerText=tempWallet.mnemonic.phrase;document.getElementById('seedDisplay').style.display='block';}
function confirmSeed(){let name=document.getElementById('sName').value,phone=document.getElementById('sPhone').value;pin=document.getElementById('sPin').value||'1234';let upCode='UP-BR-'+tempWallet.address.slice(2,6).toUpperCase();let qkybId=`qkyb_${upCode.toLowerCase()}@qkyb`;currentUser={name,phone,wallet:tempWallet,upCode,qkybId,seed:tempWallet.mnemonic.phrase};localStorage.setItem('qkyb_real_user',JSON.stringify({name,phone,address:tempWallet.address,privateKey:tempWallet.privateKey,mnemonic:tempWallet.mnemonic.phrase,upCode,qkybId}));localStorage.setItem('qkyb_pin',pin);loadMainApp();}
function importWallet(){let seed=document.getElementById('importSeed').value.trim();if(seed.split(' ').length<12){document.getElementById('authMsg').innerText='12 words needed';document.getElementById('authMsg').style.color='red';return;}try{let w=ethers.Wallet.fromPhrase(seed);pin=document.getElementById('loginPin').value||'1234';let upCode='UP-BR-'+w.address.slice(2,6).toUpperCase();let qkybId=`qkyb_${upCode.toLowerCase()}@qkyb`;currentUser={name:'Imported',wallet:w,upCode,qkybId,seed};localStorage.setItem('qkyb_real_user',JSON.stringify({name:'Imported',address:w.address,privateKey:w.privateKey,mnemonic:seed,upCode,qkybId}));localStorage.setItem('qkyb_pin',pin);loadMainApp();}catch(e){document.getElementById('authMsg').innerText='Invalid seed';}}
function loadMainApp(){document.getElementById('authPage').style.display='none';document.getElementById('mainApp').style.display='block';document.getElementById('bottomNav').style.display='flex';document.getElementById('mainApp').innerHTML=`<div class="header"><div style="display:flex;justify-content:space-between;align-items:center"><b>🛡️ QKYB</b><span style="background:#fff;color:green;padding:3px 7px;border-radius:8px;font-size:9px">${currentUser.upCode}</span></div><input id="searchBar" style="width:100%;padding:10px 14px;border-radius:24px;border:none;margin-top:10px" placeholder="🔍 Search..." onkeyup="renderHistory()"></div><div id="homePage"><div class="card"><div><div style="font-size:19px;font-weight:900" id="bal">Loading real balance...</div><div style="font-size:11px;color:#16a34a">${currentUser.name} • ${currentUser.upCode} • REAL</div><div style="font-size:8px;color:#666;word-break:break-all">${currentUser.wallet.address}</div></div><div style="background:#f5f3ff;padding:8px;border-radius:10px;font-size:11px;margin-top:8px"><b>QKYB ID:</b> ${currentUser.qkybId}<br><b>UP:</b> ${currentUser.upCode} <span class="verified">Real BTC Style ✓</span></div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn" style="background:#5b21b6;color:white;flex:1;font-size:12px" onclick="getBalance()">💰 Check Balance</button><button class="btn" style="background:#f1f5f9;flex:1;font-size:12px" onclick="claim()">💧 Claim 10 QKYB</button></div><div style="display:flex;gap:6px;margin-top:6px"><button class="btn" style="background:#e0f2fe;color:#0369a1;font-size:11px;flex:1" onclick="openExplorer()">🔍 Polygon Explorer - Real</button><button class="btn" style="background:#fef3c7;color:#92400e;font-size:11px;flex:1" onclick="showPage('history')">📜 History</button></div><p id="msg" style="font-size:11px;color:green;margin-top:6px"></p></div><div style="font-weight:800;font-size:13px;margin:14px 12px 6px">Money Transfer - Real</div><div class="grid"><div class="grid-item" onclick="openPay('mobile')"><div>📱</div>To Mobile</div><div class="grid-item" onclick="openPay('bank')"><div>🏦</div>To Bank</div><div class="grid-item" onclick="openPay('self')"><div>👤</div>To Self</div><div class="grid-item" onclick="openPay('upaddr')"><div>📍</div>UP Addr</div></div><div style="font-weight:800;font-size:13px;margin:14px 12px 6px">Recharge & Bill Payments</div><div class="grid"><div class="grid-item" onclick="openBill('Mobile Recharge')"><div>📲</div>Mobile</div><div class="grid-item" onclick="openBill('DTH')"><div>📺</div>DTH</div><div class="grid-item" onclick="openBill('Electricity')"><div>💡</div>Electric</div><div class="grid-item" onclick="openBill('Credit Card')"><div>💳</div>CC Bill</div></div></div><div id="historyPage" style="display:none"><div class="card"><b>📜 Transaction History</b><div id="historyList" style="margin-top:10px"></div></div></div><div id="profilePage" style="display:none"><div class="card"><b>👤 Real Profile - BTC Style</b><p style="font-size:11px">${currentUser.name}<br>${currentUser.wallet.address}<br>${currentUser.qkybId}</p><div style="background:#f5f3ff;padding:8px;border-radius:8px;margin-top:8px;font-size:10px;word-break:break-all"><b>Seed Phrase (BTC Style):</b><br>${currentUser.seed}</div><div style="margin-top:10px;display:flex;gap:6px"><button class="btn" style="background:#5b21b6;color:white;font-size:11px" onclick="openExplorer()">🔍 Verify on PolygonScan</button><button class="btn" style="background:#fee2e2;color:#b91c1c;font-size:11px" onclick="logout()">🚪 Logout</button></div></div></div>`;document.getElementById('bottomNav').innerHTML=`<div id="navHome" class="active" onclick="showPage('home')">🏠<br>Home</div><div onclick="openPay('upaddr')">💸<br>Send</div><div id="navHistory" onclick="showPage('history')">🕒<br>History</div><div id="navProfile" onclick="showPage('profile')">👤<br>Profile</div>`;localStorage.setItem('qkyb_logged','true');getBalance();historyData.unshift({type:'Wallet Created',from:'Real BTC Style - '+currentUser.upCode,amount:'Real Address Verified',time:'Just now',color:'green'});renderHistory();}
async function getBalance(){try{let el=document.getElementById('bal');if(el)el.innerText='Loading real...';let bal=await provider.getBalance(currentUser.wallet.address);balance=ethers.formatEther(bal);if(el)el.innerText=parseFloat(balance).toFixed(5)+' POL + '+demoBal+' QKYB';}catch(e){let el=document.getElementById('bal');if(el)el.innerText='0.00 POL + '+demoBal+' QKYB';}}
function claim(){demoBal+=10;getBalance();historyData.unshift({type:'Claim',from:'Demo QKYB Claim - '+currentUser.upCode,amount:'+10 QKYB',time:'Just now',color:'green'});renderHistory();}
function logout(){if(confirm('12 word seed yaad hai?')){localStorage.removeItem('qkyb_logged');location.reload();}}
function openExplorer(){window.open(`https://amoy.polygonscan.com/address/${currentUser.wallet.address}`,'_blank');}
function showPage(p){document.getElementById('homePage').style.display=p==='home'?'block':'none';document.getElementById('historyPage').style.display=p==='history'?'block':'none';document.getElementById('profilePage').style.display=p==='profile'?'block':'none';document.querySelectorAll('.bottom div').forEach(d=>d.classList.remove('active'));if(p==='home')document.getElementById('navHome').classList.add('active');if(p==='history'){document.getElementById('navHistory').classList.add('active');renderHistory();}if(p==='profile')document.getElementById('navProfile').classList.add('active');}
function renderHistory(){let q=document.getElementById('searchBar')?.value.toLowerCase()||'';let html='';historyData.filter(h=>(h.from+h.type).toLowerCase().includes(q)).forEach(h=>{html+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9;font-size:13px"><div><b>${h.type}</b> <span class="verified">Real ✓</span><br><small>${h.from} • ${h.time}</small><br><small style="color:#5b21b6;cursor:pointer" onclick="openExplorer()">🔍 Verify →</small></div><div style="color:${h.color};font-weight:bold">${h.amount}</div></div>`});let el=document.getElementById('historyList');if(el)el.innerHTML=html||'<p style="text-align:center;padding:20px;color:#888">No transactions</p>';}
function openPay(t){let h='';if(t==='mobile')h=`<b>📱 To Mobile</b><input id="toNum" placeholder="Mobile No"><input id="amt" placeholder="Amount QKYB"><input id="pinIn" type="password" placeholder="PIN"><button class="btn" style="background:#5b21b6;color:white" onclick="doPay('Mobile')">Send</button><button class="btn" style="background:#eee" onclick="closeM()">Cancel</button>`;else if(t==='bank')h=`<b>🏦 To Bank</b><input placeholder="A/c No"><input id="amt" placeholder="Amount"><input id="pinIn" type="password" placeholder="PIN"><button class="btn" style="background:#16a34a;color:white" onclick="doPay('Bank')">Transfer</button><button class="btn" style="background:#eee" onclick="closeM()">Cancel</button>`;else if(t==='upaddr')h=`<b>📍 To UP Real Address - Real POL</b><p style="font-size:11px">Real Blockchain - BTC Style</p><input id="toAddr" placeholder="To Real Address 0x..."><input id="amt" placeholder="Amount POL 0.001"><input id="pinIn" type="password" placeholder="PIN"><button class="btn" style="background:#5b21b6;color:white" onclick="doRealSend()">Send Real POL</button><button class="btn" style="background:#eee" onclick="closeM()">Cancel</button>`;else h=`<b>👤 To Self</b><input id="amt" placeholder="Amount"><input id="pinIn" type="password" placeholder="PIN"><button class="btn" style="background:#5b21b6;color:white" onclick="doPay('Self')">Transfer Self</button><button class="btn" style="background:#eee" onclick="closeM()">Close</button>`;showModal(h);}
function openBill(type){let h=`<b>💡 ${type}</b><input placeholder="${type} ID / Number"><input id="amt" placeholder="Amount QKYB"><input id="pinIn" type="password" placeholder="PIN"><button class="btn" style="background:#5b21b6;color:white" onclick="doBill('${type}')">Pay ${type}</button><button class="btn" style="background:#eee" onclick="closeM()">Cancel</button>`;showModal(h);}
function showModal(h){document.getElementById('modalContent').innerHTML=h;document.getElementById('modal').style.display='flex'}
function closeM(){document.getElementById('modal').style.display='none'}
function checkPin(){let p=document.getElementById('pinIn').value;if(p!==pin){alert('❌ Wrong PIN! Your PIN: '+pin);return false;}return true;}
function doPay(m){if(!checkPin())return;let amt=parseInt(document.getElementById('amt').value||'50');if(amt>demoBal){alert('Low Demo QKYB! Claim karo');return;}demoBal-=amt;getBalance();historyData.unshift({type:m,from:m+' Transfer - '+currentUser.upCode,amount:'-'+amt+' QKYB',time:'Just now',color:'red'});closeM();alert(`✅ ${m} Success ${amt} QKYB`);}
function doBill(t){if(!checkPin())return;let amt=parseInt(document.getElementById('amt').value||'100');if(amt>demoBal){alert('Low Demo QKYB');return;}demoBal-=amt;getBalance();historyData.unshift({type:t,from:t+' - '+currentUser.upCode+' - Paid',amount:'-'+amt+' QKYB',time:'Just now',color:'red'});closeM();alert(`✅ ${t} Paid ${amt} QKYB`);}
async function doRealSend(){if(!checkPin())return;let to=document.getElementById('toAddr').value,amt=document.getElementById('amt').value;if(!ethers.isAddress(to)){alert('Invalid address');return;}try{document.getElementById('modalContent').innerHTML='<p>⏳ Real POL Sending...</p>';let w=currentUser.wallet.connect(provider);let tx=await w.sendTransaction({to,value:ethers.parseEther(amt)});historyData.unshift({type:'Real Send',from:'Real to '+to.slice(0,8)+'...',amount:'-'+amt+' POL',time:'Just now',color:'red'});closeM();alert(`✅ Real Sent! Tx: ${tx.hash}`);window.open(`https://amoy.polygonscan.com/tx/${tx.hash}`,'_blank');getBalance();}catch(e){alert('❌ Failed: '+e.message+'\nFaucet: https://faucet.polygon.technology/');closeM();}}
window.onload=()=>{if(localStorage.getItem('qkyb_logged')){try{let u=JSON.parse(localStorage.getItem('qkyb_real_user')||'{}');if(u.address){let w=new ethers.Wallet(u.privateKey);currentUser={name:u.name,wallet:w,upCode:u.upCode,qkybId:u.qkybId,seed:u.mnemonic};pin=localStorage.getItem('qkyb_pin')||'1234';loadMainApp();}}catch(e){}}}
</script>
</body>
</html>
